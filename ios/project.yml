name: Sower
options:
  bundleIdPrefix: dev.ibraheemamin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Sower:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sower
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ibraheemamin.sower
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Sower/Info.plist
      properties:
        CFBundleDisplayName: Sower
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets: []
      gatherCoverageData: false
